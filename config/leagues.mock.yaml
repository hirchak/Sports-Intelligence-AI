# Mock-mode demo configuration: used only for local MOCK smoke tests so the
# default config can stay quota-safe (all leagues disabled).
#
# Run the mock smoke with:
#   LEAGUES_CONFIG_PATH=config/leagues.mock.yaml docker compose up -d
version: 1
leagues:
