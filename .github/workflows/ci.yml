name: CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    name: lint / type / test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  compose-validation:
    name: docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose.yaml
        run: docker compose config -q

      - name: Validate compose.dev.yaml override
        run: docker compose -f compose.yaml -f compose.dev.yaml config -q
