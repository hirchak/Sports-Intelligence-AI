name: sports-intel

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-mock}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sports}:${POSTGRES_PASSWORD:-sports_dev_password}@sports-postgres:5432/${POSTGRES_DB:-sports_intel}
  REDIS_URL: redis://sports-redis:6379/0
  CELERY_BROKER_URL: redis://sports-redis:6379/0
  CELERY_RESULT_BACKEND: redis://sports-redis:6379/1
  SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
  SPORTS_API_KEY: ${SPORTS_API_KEY:-}
  API_FOOTBALL_BASE_URL: ${API_FOOTBALL_BASE_URL:-https://v3.football.api-sports.io}
  LEAGUES_CONFIG_PATH: ${LEAGUES_CONFIG_PATH:-config/leagues.yaml}

services:
  sports-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sports_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sports_intel}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sports_intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sports-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - sports_intel_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sports-api:
    build:
      context: .
      target: production
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      sports-postgres:
        condition: service_healthy
      sports-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sports-worker:
    build:
      context: .
      target: production
    command:
      [
        "celery",
        "-A",
        "sports_intelligence.workers.celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=control,sports_io,research_io,llm,evaluation,notifications",
      ]
    environment: *app-environment
    depends_on:
      sports-postgres:
        condition: service_healthy
      sports-redis:
        condition: service_healthy
    restart: unless-stopped

  sports-beat:
    build:
      context: .
      target: production
    command:
      [
        "celery",
        "-A",
        "sports_intelligence.workers.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *app-environment
    depends_on:
      sports-postgres:
        condition: service_healthy
      sports-redis:
        condition: service_healthy
    restart: unless-stopped

  sports-telegram:
    build:
      context: .
      target: production
    command: ["python", "-m", "sports_intelligence.bot"]
    profiles: ["telegram"]
    environment:
      <<: *app-environment
      BOT_BACKEND_BASE_URL: http://sports-api:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    depends_on:
      sports-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sports_intel_pgdata:
  sports_intel_redisdata:
